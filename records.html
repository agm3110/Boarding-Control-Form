<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boarding Control Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .page-wrap {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }
    .topbar {
      background: #00205B;
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .panel {
      background: white;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      padding: 20px;
    }
    .search-box {
      width: min(700px, 100%);
    }
    .search-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr auto;
      gap: 12px;
      width: 100%;
      align-items: end;
    }
    .table td, .table th {
      vertical-align: middle;
    }
    .search-btn {
      height: 38px;
      white-space: nowrap;
    }
    .pdf-link {
      color: #D81939;
      font-weight: 600;
      text-decoration: none;
    }
    .pdf-link:hover {
      text-decoration: underline;
    }
    .record-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .action-btn {
      min-width: 70px;
    }
    .empty-state {
      padding: 32px;
      text-align: center;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="topbar">
      <div>
        <h2 class="mb-0">Boarding Control Archive</h2>
      </div>
      <div class="search-box">
        <div class="search-grid">
          <input id="searchInput" class="form-control" type="text" placeholder="Flight number or destination" />
          <input id="dateFromInput" class="form-control" type="date" aria-label="Date from" />
          <input id="dateToInput" class="form-control" type="date" aria-label="Date to" />
          <button id="searchBtn" class="btn btn-light search-btn" type="button">Search</button>
          <button id="clearBtn" class="btn btn-outline-light search-btn" type="button">Clear</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th>Date</th>
              <th>Flight</th>
              <th>Destination</th>
              <th>PDF</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state d-none">No records found.</div>
    </div>
  </div>

  <script>
    const tableBody = document.getElementById('recordsTableBody');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const dateFromInput = document.getElementById('dateFromInput');
    const dateToInput = document.getElementById('dateToInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');

    async function loadRecords() {
      const response = await fetch('/api/records');
      const data = await response.json();
      return data || [];
    }

    function getDestinationLabel(record) {
      const code = record.destination || 'N/A';
      const map = {
        OSL: 'OSL - Oslo Gardermoen',
        ARN: 'ARN - Stockholm Arlanda',
        CPH: 'CPH - Copenhagen Airport',
        LHR: 'LHR - London Heathrow',
        MAD: 'MAD - Madrid Barajas',
        BGO: 'BGO - Bergen Airport',
        GOT: 'GOT - Gothenburg Landvetter',
        TRD: 'TRD - Trondheim Airport',
        AAL: 'AAL - Aalborg Airport',
        AMS: 'AMS - Amsterdam Schiphol',
        CDG: 'CDG - Paris Charles de Gaulle',
        FRA: 'FRA - Frankfurt Airport',
        HEL: 'HEL - Helsinki Airport',
        MUC: 'MUC - Munich Airport',
        PRG: 'PRG - Prague Airport'
      };

      return map[code] || code;
    }

    function renderRecords(records) {
      tableBody.innerHTML = '';

      if (!records.length) {
        emptyState.classList.remove('d-none');
        return;
      }

      emptyState.classList.add('d-none');

      records.forEach((record) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${record.date || 'N/A'}</td>
          <td>${record.flightNumber || 'N/A'}</td>
          <td>${getDestinationLabel(record)}</td>
          <td>
            <div class="record-actions">
              <a class="btn btn-sm btn-outline-primary action-btn" href="${record.pdfUrl}" target="_blank" rel="noopener">Open</a>
              <a class="btn btn-sm btn-outline-success action-btn" href="${record.pdfUrl}" download>Save</a>
              <button class="btn btn-sm btn-outline-warning action-btn edit-btn" type="button" data-record-id="${record.id || ''}">Edit</button>
            </div>
          </td>
        `;
        row.querySelector('.edit-btn')?.addEventListener('click', () => {
          const recordId = row.querySelector('.edit-btn').getAttribute('data-record-id');
          if (recordId) {
            window.location.href = `/?edit=${encodeURIComponent(recordId)}`;
          }
        });
        tableBody.appendChild(row);
      });
    }

    function dateInRange(dateString, fromDate, toDate) {
      if (!dateString) return true;
      if (!fromDate && !toDate) return true;
      if (fromDate && toDate && fromDate > toDate) {
        [fromDate, toDate] = [toDate, fromDate];
      }
      const candidate = new Date(dateString + 'T00:00:00');
      const from = fromDate ? new Date(fromDate + 'T00:00:00') : null;
      const to = toDate ? new Date(toDate + 'T00:00:00') : null;

      if (from && candidate < from) return false;
      if (to && candidate > to) return false;
      return true;
    }

    function applySearch() {
      const term = (searchInput.value || '').trim().toLowerCase();
      const fromDate = (dateFromInput.value || '').trim();
      const toDate = (dateToInput.value || '').trim();

      const filtered = allRecords.filter((record) => {
        const destinationLabel = getDestinationLabel(record).toLowerCase();
        const flightMatch = !term || record.flightNumber?.toLowerCase().includes(term) || false;
        const destinationMatch = !term || destinationLabel.includes(term) || false;
        const dateMatch = dateInRange(record.date, fromDate, toDate);

        return (flightMatch || destinationMatch) && dateMatch;
      });

      renderRecords(filtered);
    }

    function clearSearch() {
      searchInput.value = '';
      dateFromInput.value = '';
      dateToInput.value = '';
      renderRecords(allRecords);
    }

    let allRecords = [];

    async function init() {
      allRecords = await loadRecords();
      renderRecords(allRecords);
    }

    searchBtn.addEventListener('click', applySearch);
    searchInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        applySearch();
      }
    });
    dateFromInput.addEventListener('change', applySearch);
    dateToInput.addEventListener('change', applySearch);
    clearBtn.addEventListener('click', clearSearch);

    init();
  </script>
</body>
</html>
